name: Pilot economics offline tests
on:
  push:
    branches: [screenmind-v5-pilot-economics, screenmind-v5-tenant-pilot, screenmind-v5-pilot-admin]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node --check ai-gateway/server.mjs
      - run: node --test ai-gateway/pilot-economics.test.mjs ai-gateway/pilot-guard.test.mjs ai-gateway/tenant-auth.test.mjs ai-gateway/pilot-admin.test.mjs
      - run: node ai-gateway/pilot-economics.mjs
