name: Pilot economics offline tests
on:
  push:
    branches: [screenmind-v5-pilot-economics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node --test ai-gateway/pilot-economics.test.mjs
      - run: node ai-gateway/pilot-economics.mjs
