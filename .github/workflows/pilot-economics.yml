name: Pilot economics offline tests
on:
  push:
    branches: [screenmind-v5-pilot-economics, screenmind-v5-tenant-pilot, screenmind-v5-pilot-admin, screenmind-v5-usage-meter, screenmind-v5-model-comparison, screenmind-v5-task-routing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node --check ai-gateway/server.mjs
      - run: node --test ai-gateway/pilot-economics.test.mjs ai-gateway/pilot-guard.test.mjs ai-gateway/tenant-auth.test.mjs ai-gateway/pilot-admin.test.mjs ai-gateway/usage-meter.test.mjs ai-gateway/bedrock.test.mjs ai-gateway/gemini.test.mjs ai-gateway/model-lab/lab.test.mjs ai-gateway/model-lab/compare.test.mjs ai-gateway/task-routing.test.mjs
      - run: node ai-gateway/pilot-economics.mjs
