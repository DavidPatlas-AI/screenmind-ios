name: ScreenMind personal iPhone IPA
on:
  workflow_dispatch:
  push:
    branches:
      - screenmind-v2-experience
      - screenmind-v2-projects
      - screenmind-v2-intelligence
      - screenmind-v2-ai
      - screenmind-v2-release-safety
      - screenmind-v2-quality
      - screenmind-v2-rediscovery
      - screenmind-v2-stories
      - screenmind-v2-bedrock
      - screenmind-v2-pilot-guard
      - screenmind-v2-backup-check
      - screenmind-v2-gemini
      - screenmind-v2-model-lab
      - screenmind-v2-safe-restore
      - screenmind-v2-library-backup
      - screenmind-v2-encrypted-backup
      - screenmind-v2-home-polish
      - screenmind-v2-spatial-brain
      - screenmind-v2-article-studio
      - screenmind-v2-grounded-writing
      - screenmind-v2-article-ai-ui
      - screenmind-v2-memory-chat
      - screenmind-v2-grounded-qa
      - screenmind-v2-qa-ui
      - screenmind-v2-attention-center
      - screenmind-v2-local-reminders
      - screenmind-v2-project-bridges
      - screenmind-v2-scale-validation
      - screenmind-v2-search-performance
      - screenmind-v2-beta-hardening
      - screenmind-v2-beta-polish
      - screenmind-v5-beta-candidate
      - screenmind-v5-memory-evolution
permissions:
  contents: read
concurrency:
  group: screenmind-personal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  personal:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check AI gateway JavaScript syntax
        run: |
          node --check ai-gateway/server.mjs
          node --test ai-gateway/bedrock.test.mjs ai-gateway/pilot-guard.test.mjs ai-gateway/gemini.test.mjs ai-gateway/model-lab/lab.test.mjs ai-gateway/article.test.mjs ai-gateway/answer.test.mjs
      - name: Generate standalone personal edition
        run: SCREENMIND_PERSONAL=1 node scripts/generate-project.mjs
      - name: Test personal edition on simulator
        run: bash scripts/ci-simulator.sh
      - name: Build device IPA for local signing
        run: bash scripts/build-personal-ipa.sh
      - name: Upload IPA and installation guide
        uses: actions/upload-artifact@v7
        with:
          name: ScreenMind-Personal-iPhone
          path: |
            personal-output/ScreenMind-Personal-unsigned.ipa
            personal-output/SHA256.txt
            INSTALL-IPHONE-WINDOWS.md
          if-no-files-found: error
          retention-days: 14
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ScreenMind-Personal-verification
          path: ci-results/
          retention-days: 14
