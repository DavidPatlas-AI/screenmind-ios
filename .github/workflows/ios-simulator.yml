name: ScreenMind iPhone build and tests

# Manual only: uploading source does not start a metered Mac job.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenmind-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check project structure
        run: node scripts/validate-project.mjs
      - name: Check simulator selection
        run: python3 -B scripts/test_select_simulator.py
      - name: Build and run XCTest on an available iPhone simulator
        run: bash scripts/ci-simulator.sh
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ScreenMind-iOS-verification
          path: ci-results/
          if-no-files-found: warn
          retention-days: 7
