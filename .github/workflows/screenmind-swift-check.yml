name: ScreenMind Swift checks
on:
  push:
    branches: [screenmind-v2-memory-answers]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Swift syntax check
        run: |
          find ScreenMind Shared -name '*.swift' -print0 | while IFS= read -r -d '' file; do
            swiftc -frontend -parse "$file" || exit 1
          done
      - name: Simulator build without signing
        run: |
          set -euo pipefail
          if [ ! -d ScreenMind.xcodeproj ] && [ -f project.yml ]; then
            brew install xcodegen
            xcodegen generate
          fi
          xcodebuild -project ScreenMind.xcodeproj -scheme ScreenMind -configuration Debug -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests on available iPhone simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d,reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          xcodebuild -project ScreenMind.xcodeproj -scheme ScreenMind -configuration Debug -destination "platform=iOS Simulator,id=$device" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:ScreenMindTests test
      - name: Build unsigned physical iPhone app
        run: |
          set -euo pipefail
          xcodebuild -project ScreenMind.xcodeproj -scheme ScreenMind -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/screenmind-device" CODE_SIGNING_ALLOWED=NO build
      - name: Upload unsigned device build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: ScreenMind-unsigned-device
          path: ${{ runner.temp }}/screenmind-device/Build/Products/Release-iphoneos/ScreenMind.app
          if-no-files-found: error
          retention-days: 7
